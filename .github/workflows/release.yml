name: Build and publish Windows installer

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify installer
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Restore and build Release
        run: msbuild Spectrum.sln -restore -p:RestorePackagesConfig=true -p:Configuration=Release -p:LangVersion=14.0 -verbosity:minimal -nologo

      - name: Configure desktop for native UI tests
        shell: powershell
        run: |
          # The default 1024x768 hosted desktop clamps the windows exercised by this suite.
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Explicit, Size = 220)]
          public struct DisplayMode {
            [FieldOffset(68)] public ushort Size;
            [FieldOffset(168)] public uint BitsPerPixel;
            [FieldOffset(172)] public uint Width;
            [FieldOffset(176)] public uint Height;
          }
          public static class DisplayModes {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern bool EnumDisplaySettings(IntPtr device, int index, ref DisplayMode mode);
          }
          '@
          $modes = @()
          for ($index = 0; ; $index++) {
            $mode = New-Object DisplayMode
            $mode.Size = 220
            if (![DisplayModes]::EnumDisplaySettings([IntPtr]::Zero, $index, [ref]$mode)) { break }
            $modes += $mode
          }
          Write-Output "Enumerated $($modes.Count) display modes."
          $modes | Select-Object Width, Height, BitsPerPixel -Unique | Format-Table | Out-String | Write-Output
          $target = $modes | Where-Object { $_.Width -ge 1920 -and $_.Height -ge 1440 -and $_.BitsPerPixel -eq 32 } |
            Sort-Object { [long]$_.Width * $_.Height } | Select-Object -First 1
          if (!$target) { throw 'The runner video device has no display mode large enough for the native UI tests.' }
          Set-DisplayResolution -Width $target.Width -Height $target.Height -Force
          Start-Sleep -Seconds 2
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          Write-Output "Desktop bounds: $($screen.Bounds); working area: $($screen.WorkingArea)"
          if ($screen.WorkingArea.Width -lt 1920 -or $screen.WorkingArea.Height -lt 1280) {
            throw 'Native UI tests require a desktop that can contain the 1800x1200 workbench and Full HD windows.'
          }

      - name: Run x86 regression suite
        run: dotnet vstest .\Spectrum.Tests\bin\Release\net48\Spectrum.Tests.dll /Platform:x86 '/Logger:console;verbosity=normal' '/Logger:trx;LogFileName=tests.trx' /ResultsDirectory:TestResults

      - name: Compile Windows installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler is missing from the runner.' }
          $source = (Resolve-Path .\Spectrum\bin\Release).Path
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer'
          & $compiler "/DSourceDir=$source" "/DInstallerOutputDir=$output" "/DBuildId=$env:GITHUB_SHA" .\installer\Spectrum.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

      - name: Verify installation, reinstallation, and uninstallation
        run: |
          $installer = (Resolve-Path .\artifacts\installer\SpectrumSetup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Spectrum-installer-smoke'
          $source = (Resolve-Path .\Spectrum\bin\Release).Path
          # The hosted runner is disposable; never run this against a user's installation.
          foreach ($pass in 1..2) {
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS',
              "/DIR=`"$installDir`"", "/LOG=`"$env:GITHUB_WORKSPACE\TestResults\install-$pass.log`"")
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer pass $pass failed: $($process.ExitCode)" }
            foreach ($file in Get-ChildItem -LiteralPath $source -File) {
              $installed = Join-Path $installDir $file.Name
              if (!(Test-Path -LiteralPath $installed) -or
                  (Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) {
                throw "Installed payload differs: $($file.Name)"
              }
            }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$env:GITHUB_WORKSPACE\TestResults\uninstall.log`"")
          $process = Start-Process -FilePath $uninstaller -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw 'Installer uninstall verification failed.'
          }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{CB9C7107-C434-4C82-9E54-933F19BD7BAC}_is1'
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          do {
            $remaining = @(Get-ChildItem -LiteralPath $source -File | Where-Object { Test-Path -LiteralPath (Join-Path $installDir $_.Name) })
            $registered = Test-Path -LiteralPath $uninstallKey
            if ($remaining.Count -eq 0 -and !$registered) { break }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($remaining.Count -ne 0 -or $registered) { throw 'Uninstall left application files or registration behind.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'artifacts\installer\SpectrumSetup.exe.sha256'), "$hash  SpectrumSetup.exe`n", [Text.Encoding]::ASCII)

      - name: Retain test and installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-logs
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Retain verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          path: artifacts/installer/SpectrumSetup.exe*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish public download
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installer
          path: installer

      - name: Publish release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd installer
          sha256sum --check SpectrumSetup.exe.sha256
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          prerelease=true
          if [[ "$SOURCE_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            prerelease=false
          fi
          printf '%s\n' \
            "Windows installer built from commit $GITHUB_SHA on branch $SOURCE_BRANCH." \
            '' \
            'Download SpectrumSetup.exe, run it, and launch Spectrum from the Start menu.' \
            'Installs for the current Windows user; .NET Framework 4.8 or later is required.' \
            '' \
            'The x86 application, native audio libraries, and third-party notices are included.' \
            'The installer is unsigned. A SHA-256 checksum is provided alongside it.' \
            '' \
            "Build and verification: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            > release-notes.md
          gh release create "$tag" SpectrumSetup.exe SpectrumSetup.exe.sha256 \
            --target "$GITHUB_SHA" --title "Spectrum build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --draft --prerelease="$prerelease"
          gh release edit "$tag" --draft=false --latest=false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo '### Windows installer'
            echo "[Download this build]($GITHUB_SERVER_URL/$GH_REPO/releases/download/$tag/SpectrumSetup.exe)"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Update latest download
    needs: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # All pushes publish above. Only latest-link updates need serialization.
    concurrency:
      group: spectrum-installer-latest
      cancel-in-progress: false
    steps:
      - name: Promote the newest successful default-branch build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # A pending promotion can be superseded. Always select the newest published
          # default-branch build, even when an older run is performing this update.
          tags=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest_tag="$RELEASE_TAG"
          newest_run=0
          newest_attempt=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^build-([0-9]+)-([0-9]+)$ ]]; then
              run=${BASH_REMATCH[1]}
              attempt=${BASH_REMATCH[2]}
              if (( run > newest_run || (run == newest_run && attempt > newest_attempt) )); then
                newest_tag="$tag"
                newest_run=$run
                newest_attempt=$attempt
              fi
            fi
          done <<< "$tags"
          gh release edit "$newest_tag" --latest
          echo "[Download latest Windows installer]($GITHUB_SERVER_URL/$GH_REPO/releases/latest/download/SpectrumSetup.exe)" >> "$GITHUB_STEP_SUMMARY"
