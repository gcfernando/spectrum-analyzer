# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/spectrum-analyzer"
title: "Spectrum Audio Analyzer"
description: "Windows WASAPI audio spectrum analyzer in C# and Windows Forms, with 83 logarithmic bands, 21 visualization modes and 13 palettes."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "README.md"
    values:
      title: "Spectrum — Windows WASAPI Audio Spectrum Analyzer"
      description: "Windows WASAPI audio spectrum analyzer in C# and Windows Forms, with 83 logarithmic bands, 21 visualization modes and 13 palettes."
      image:
        path: /assets/images/overview.png
        width: 1800
        height: 720
        alt: "Spectrum Overview mode with a frequency spectrum and left and right channel meters"

# Public documentation navigation and presentation.
repository: gcfernando/spectrum-analyzer
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Audio & desktop"
